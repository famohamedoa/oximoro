<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXIMORO</title>
  <noscript><meta http-equiv="refresh" content="5;url=tema.html"></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Beastly&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #870c0c;
      --texto: #f3f4f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    body.saindo {
      opacity: 0;
    }

    .titulo {
      padding: 0.3em 0.2em;
      font-family: "Rubik Beastly", Impact, "Arial Black", sans-serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 15vw, 14rem);
      line-height: 1;
      text-align: center;
    }

    /* camada com as cores invertidas, cobrindo a tela toda e recortada pela faixa que passa */
    .invertido {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--texto);
      color: var(--fundo);
      pointer-events: none;
      clip-path: inset(0 100% 0 0);   /* começa totalmente escondida */
    }
  </style>
</head>
<body>
  <h1 class="titulo">OXIMORO</h1>
  <div class="invertido" id="invertido" aria-hidden="true">
    <div class="titulo">OXIMORO</div>
  </div>

  <script>
    (function () {
      var DURACAO = 5000;     // tempo total até abrir a próxima página (ms)
      var DESVANECER = 500;   // tempo do fade final (ms)
      var DESTINO = "tema.html";

      var LARGURA_FAIXA = 0.24;   // largura da faixa, em fração da largura da tela
      // momentos da animação, em fração da duração total: pausa, ida, volta (depois fica parado nas cores originais)
      var INICIO_IDA = 0.12, FIM_IDA = 0.50, FIM_VOLTA = 0.88;

      var camada = document.getElementById("invertido");
      var reduzirMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function suave(x) {   // começa e termina devagar
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function limitar(v) { return Math.min(100, Math.max(0, v)); }

      function iniciar() {
        var inicio = performance.now();

        setTimeout(function () {
          document.body.classList.add("saindo");
        }, DURACAO - DESVANECER);

        setTimeout(function () {
          window.location.replace(DESTINO);
        }, DURACAO);

        if (reduzirMovimento) return;

        var meia = LARGURA_FAIXA / 2;

        function quadro(agora) {
          var t = (agora - inicio) / DURACAO;
          if (t >= 1) return;

          // centro da faixa (0 = borda esquerda, 1 = borda direita), de fora da tela até fora da tela
          var de = -meia, ate = 1 + meia, centro = null;
          if (t >= INICIO_IDA && t < FIM_IDA) {
            centro = de + (ate - de) * suave((t - INICIO_IDA) / (FIM_IDA - INICIO_IDA));
          } else if (t >= FIM_IDA && t < FIM_VOLTA) {
            centro = ate - (ate - de) * suave((t - FIM_IDA) / (FIM_VOLTA - FIM_IDA));
          }

          if (centro === null) {
            camada.style.clipPath = "inset(0 100% 0 0)";
          } else {
            var esquerda = limitar((centro - meia) * 100);
            var direita = limitar((centro + meia) * 100);
            camada.style.clipPath = "inset(0 " + (100 - direita) + "% 0 " + esquerda + "%)";
          }

          requestAnimationFrame(quadro);
        }

        requestAnimationFrame(quadro);
      }

      // espera a fonte carregar (no máximo 1,5 s) para a animação não começar com a fonte errada
      var fonte = (document.fonts && document.fonts.load)
        ? document.fonts.load('1em "Rubik Beastly"')
        : Promise.resolve();
      var limite = new Promise(function (resolve) { setTimeout(resolve, 1500); });
      Promise.race([fonte, limite]).then(iniciar, iniciar);
    })();
  </script>
</body>
</html>
