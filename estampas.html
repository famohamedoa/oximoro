
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXIMORO | Estampas</title>
  <link rel="preload" as="image" href="imagens/estampa1.png">
  <link rel="preload" as="image" href="imagens/estampa2.png">
  <style>
    :root {
      --fundo: #870c0c;   /* aparece só enquanto as imagens carregam */
      --seta: #ffffff;
      --expandir: 0.7s;   /* duração do crescimento ao passar o mouse */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background-color: var(--fundo);
    }

    body {
      animation: entrar 0.5s ease;
    }

    @keyframes entrar {
      from { opacity: 0; }
    }

    .so-leitor {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* As duas estampas têm sempre o tamanho da tela; o que muda é só o recorte (clip-path).
       Assim a imagem nunca é esticada: ela é revelada, como uma cortina. */
    .estampa {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      clip-path: inset(0);
      transition: clip-path var(--expandir) cubic-bezier(0.65, 0, 0.35, 1);
    }

    .estampa.on {
      opacity: 1;
    }

    /* depois das piscadas: metade para cada uma (1px de sobra para não aparecer fresta no meio) */
    .dividido .e1 { clip-path: inset(0 calc(50% - 1px) 0 0); }
    .dividido .e2 { clip-path: inset(0 0 0 50%); }

    /* a estampa ativa cresce até a tela inteira e fica por cima da outra */
    .dividido.ativa-1 .e1,
    .dividido.ativa-2 .e2 {
      clip-path: inset(0);
      z-index: 2;
    }

    /* telas em pé: uma em cima e a outra embaixo */
    @media (max-aspect-ratio: 1/1) {
      .dividido .e1 { clip-path: inset(0 0 calc(50% - 1px) 0); }
      .dividido .e2 { clip-path: inset(50% 0 0 0); }
    }

    /* seta branca para voltar ao menu */
    .voltar {
      position: fixed;
      top: clamp(1rem, 3.5vh, 2.25rem);
      left: clamp(1rem, 3vw, 2.5rem);
      z-index: 10;
      display: inline-flex;
      padding: 0.4rem;
      color: var(--seta);
      filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.45));
    }

    .voltar svg {
      width: clamp(2rem, 3vw, 3rem);
      height: auto;
      transition: transform 0.2s ease;
    }

    .voltar:hover svg,
    .voltar:focus-visible svg {
      transform: translateX(-5px);
    }

    .voltar:focus-visible {
      outline: 2px solid var(--seta);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      .estampa,
      .voltar svg { transition: none; }
    }
  </style>
  <!-- sem JavaScript: mostra direto as duas estampas divididas ao meio -->
  <noscript>
    <style>
      .estampa { opacity: 1; }
      .e1 { clip-path: inset(0 calc(50% - 1px) 0 0); }
      .e2 { clip-path: inset(0 0 0 50%); }
    </style>
  </noscript>
</head>
<body>
  <h1 class="so-leitor">Estampas</h1>

  <img class="estampa e1" src="imagens/estampa1.png" alt="Estampa 1" draggable="false">
  <img class="estampa e2" src="imagens/estampa2.png" alt="Estampa 2" draggable="false">

  <a class="voltar" href="menu.html" aria-label="Voltar ao menu">
    <svg viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M47 12H2M12 2L2 12L12 22" vector-effect="non-scaling-stroke"/>
    </svg>
  </a>

  <script>
    (function () {
      var INTERVALO = 500;   // quanto tempo cada estampa fica na tela durante as piscadas (ms)
      var PISCADAS = 6;      // quantas vezes uma estampa aparece: 1, 2, 1, 2, 1, 2

      var reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var corpo = document.body;
      var e1 = document.querySelector(".e1");
      var e2 = document.querySelector(".e2");
      var dividido = false;
      var ativa = null;   // null = metade/metade, 1 ou 2 = estampa em tela cheia

      // estampa que não carregar (arquivo ausente) some em vez de mostrar o ícone quebrado
      [e1, e2].forEach(function (img) {
        img.addEventListener("error", function () { img.style.display = "none"; });
      });

      // depois das piscadas: cada estampa ocupa uma metade
      function dividir() {
        dividido = true;
        e1.classList.add("on");
        e2.classList.add("on");
        corpo.classList.add("dividido");
      }

      // 1 = primeira metade (esquerda, ou em cima nas telas em pé), 2 = segunda
      function zona(x, y) {
        var emPe = window.matchMedia("(max-aspect-ratio: 1/1)").matches;
        var primeira = emPe ? y < window.innerHeight / 2 : x < window.innerWidth / 2;
        return primeira ? 1 : 2;
      }

      function definirAtiva(n) {
        if (!dividido || n === ativa) return;
        ativa = n;
        corpo.classList.toggle("ativa-1", n === 1);
        corpo.classList.toggle("ativa-2", n === 2);
      }

      // Como a estampa que cresce cobre a tela toda, quem manda é a posição do mouse:
      // na metade esquerda (ou de cima) aparece a estampa 1; na outra, a estampa 2.
      // Ao tirar o mouse da janela, a tela volta a ser dividida.
      document.addEventListener("pointermove", function (e) {
        if (e.pointerType === "touch") return;
        definirAtiva(zona(e.clientX, e.clientY));
      });

      document.documentElement.addEventListener("mouseleave", function () {
        definirAtiva(null);
      });

      // celular: um toque abre a estampa daquela metade; outro toque volta ao meio a meio
      document.addEventListener("pointerdown", function (e) {
        if (e.pointerType !== "touch" || e.target.closest(".voltar")) return;
        definirAtiva(ativa ? null : zona(e.clientX, e.clientY));
      });

      // teclado: setas escolhem a estampa, Esc volta ao meio a meio
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") definirAtiva(1);
        else if (e.key === "ArrowRight" || e.key === "ArrowDown") definirAtiva(2);
        else if (e.key === "Escape") definirAtiva(null);
      });

      // menos movimento: sem piscadas, já começa dividido
      if (reduzir) {
        dividir();
        return;
      }

      // espera as duas imagens carregarem (no máximo 4 s) para as piscadas começarem certas
      function carregada(img) {
        return (img.decode ? img.decode() : Promise.resolve()).catch(function () {});
      }
      var limite = new Promise(function (resolve) { setTimeout(resolve, 4000); });

      Promise.race([Promise.all([e1, e2].map(carregada)), limite]).then(function () {
        for (var k = 0; k < PISCADAS; k++) {
          (function (k) {
            setTimeout(function () {
              var primeira = k % 2 === 0;
              e1.classList.toggle("on", primeira);
              e2.classList.toggle("on", !primeira);
            }, 200 + k * INTERVALO);
          })(k);
        }
        setTimeout(dividir, 200 + PISCADAS * INTERVALO);
      });
    })();
  </script>
</body>
</html>
