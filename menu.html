<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXIMORO | Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #f3f4f0;   /* cor enquanto a imagem carrega */
      --texto: #870c0c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background-color: var(--fundo);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(1.5rem, 5vw, 4rem);
      background: var(--fundo) url("imagens/fundo.png") center / cover no-repeat;
      color: var(--texto);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 200;
      animation: entrar 0.5s ease;
    }

    @keyframes entrar {
      from { opacity: 0; }
    }

    ul {
      list-style: none;
    }

    a {
      display: inline-block;
      padding: 0.08em 0;
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
      font-size: clamp(1.8rem, min(9vw, 6vh), 5.5rem);
      line-height: 1.05;
      transition: opacity 0.2s ease;
    }

    /* ao passar o mouse (ou focar com o teclado), os outros itens esmaecem */
    ul:hover a,
    ul:focus-within a {
      opacity: 0.45;
    }

    ul a:hover,
    ul a:focus-visible {
      opacity: 1;
    }

    a:focus-visible {
      outline: 2px solid var(--texto);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      a { transition: none; }
    }
  </style>
</head>

      <li><a href="colecao.html">COLEÇÃO</a></li>
      <li><a href="desfile.html">DESFILE</a></li>
      <li><a href="designer.html">A DESIGNER</a></li>
    </ul>
  </nav>
</body>
</html>
