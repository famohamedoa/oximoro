<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXIMORO | Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&family=Rubik+Beastly&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #f3f4f0;
      --texto: #000000;
      --vermelho: #870c0c;
      --margem: clamp(1.5rem, 5vw, 4rem);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background-color: var(--fundo);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: stretch;
      background: var(--fundo);
      color: var(--texto);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      animation: entrar 0.5s ease;
    }

    @keyframes entrar {
      from { opacity: 0; }
    }

    /* gif colado na esquerda, ocupando toda a altura da tela */
    .foto {
      flex: none;
      width: auto;
      max-width: 50vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    /* texto à direita, alinhado à esquerda */
    .texto {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(2rem, 6vh, 4rem) var(--margem);
    }

    .texto h1 {
      font-family: "Rubik Beastly", system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(2rem, 4.5vw, 4rem);
      line-height: 1.05;
      text-transform: uppercase;
      text-align: left;
      color: var(--vermelho);
    }

    .texto p {
      /* --recuo empurra o parágrafo até o "O" de MOHAMED (calculado pelo JavaScript) */
      width: min(calc(100% - var(--recuo, 0px)), 560px);
      margin-top: 1.5rem;
      margin-left: var(--recuo, 0px);
      font-size: clamp(1rem, 1.45vw, 1.35rem);
      line-height: 1.55;
      text-align: left;
    }

    /* seta para voltar ao menu */
    .voltar {
      position: absolute;
      top: clamp(1rem, 3.5vh, 2.25rem);
      left: calc(var(--margem) - 0.4rem);
      z-index: 3;
      display: inline-flex;
      padding: 0.4rem;
      color: var(--vermelho);
    }

    .voltar svg {
      width: clamp(2rem, 3vw, 3rem);
      height: auto;
      transition: transform 0.2s ease;
    }

    .voltar:hover svg,
    .voltar:focus-visible svg {
      transform: translateX(-5px);
    }

    .voltar:focus-visible {
      outline: 2px solid var(--vermelho);
      outline-offset: 2px;
    }

    /* celular: gif em cima, texto embaixo */
    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      .foto {
        width: 100%;
        max-width: none;
        height: 55vh;
        height: 55dvh;
      }

      .texto {
        justify-content: flex-start;
      }

      .texto p {
        margin-left: 0;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      .voltar svg { transition: none; }
    }
  </style>
</head>
<body>
  <a class="voltar" href="menu.html" aria-label="Voltar ao menu">
    <svg viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M47 12H2M12 2L2 12L12 22" vector-effect="non-scaling-stroke"/>
    </svg>
  </a>

  <img class="foto" src="imagens/fatima.gif" alt="Fatima Mohamed">

  <main class="texto">
    <h1>Fatima M<span id="o-mohamed">o</span>hamed</h1>
    <p>Formada em Design de Moda, o trabalho parte de pesquisas em arte contemporânea, arquitetura brutalista e movimentos de vanguarda para construir peças que não se resumem a tendências.</p>
  </main>

  <script>
    // alinha o início do parágrafo ao "O" de MOHAMED
    (function () {
      var titulo = document.querySelector(".texto h1");
      var marca = document.getElementById("o-mohamed");
      var paragrafo = document.querySelector(".texto p");

      function alinhar() {
        var celular = window.matchMedia("(max-width: 700px)").matches;
        var recuo = celular ? 0 : marca.getBoundingClientRect().left - titulo.getBoundingClientRect().left;
        paragrafo.style.setProperty("--recuo", Math.max(0, recuo).toFixed(1) + "px");
      }

      alinhar();
      window.addEventListener("resize", alinhar);
      // recalcula quando a fonte do título termina de carregar
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(alinhar);
      window.addEventListener("load", alinhar);
    })();
  </script>
</body>
</html>
